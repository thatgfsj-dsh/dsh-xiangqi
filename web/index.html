<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="中国象棋对弈网站：人类在浏览器走子，本机 agent 用工具应战。">
<title>象棋 · 与 agent 对弈</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app" id="app" aria-busy="false">

  <aside class="side" aria-label="对局信息">

    <div class="net-banner" id="net-banner" role="status" hidden></div>

    <header class="topbar" id="topbar">
      <div class="turn" id="turn">
        <span class="dot dot--turn" id="turn-dot" aria-hidden="true"></span>
        <span class="turn-text" id="turn-text">正在连接…</span>
        <span class="badge" id="turn-you" hidden>你</span>
      </div>
      <div class="timer" id="timer" role="timer" aria-label="剩余时间">--:--</div>
    </header>

    <div class="toolbar" id="controls" role="toolbar" aria-label="对局操作">
      <button class="btn btn--primary" id="btn-new" type="button">新局</button>
      <button class="btn" id="btn-undo" type="button">悔棋</button>
      <button class="btn" id="btn-resign" type="button">认输</button>
      <button class="btn" id="btn-record" type="button">记谱</button>
      <button class="btn btn--icon" id="btn-sound" type="button" aria-pressed="true" title="音效：开（点击关闭）" aria-label="音效开关">🔊</button>
    </div>

    <section class="record" id="record-panel" aria-label="棋谱">
      <div class="record-head">
        <span class="record-title">棋谱</span>
        <span class="record-count" id="record-count">0 手</span>
      </div>
      <div class="record-scroll" id="record-scroll">
        <ol class="record-list" id="record-list"></ol>
        <p class="record-empty" id="record-empty">还没有着法。红先，点自己的棋子开始。</p>
      </div>
    </section>

  </aside>

  <main class="stage" id="stage">
    <div class="board" id="board" role="group" aria-label="象棋棋盘，红方在下">
      <svg class="board-grid" viewBox="-0.62 -0.62 9.24 10.24" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
        <g class="grid-lines" fill="none" aria-hidden="true">
          <rect class="grid-outer" x="-0.16" y="-0.16" width="8.32" height="9.32" rx="0.05" />
          <line class="grid-line" x1="0" y1="0" x2="8" y2="0" />
          <line class="grid-line" x1="0" y1="1" x2="8" y2="1" />
          <line class="grid-line" x1="0" y1="2" x2="8" y2="2" />
          <line class="grid-line" x1="0" y1="3" x2="8" y2="3" />
          <line class="grid-line" x1="0" y1="4" x2="8" y2="4" />
          <line class="grid-line" x1="0" y1="5" x2="8" y2="5" />
          <line class="grid-line" x1="0" y1="6" x2="8" y2="6" />
          <line class="grid-line" x1="0" y1="7" x2="8" y2="7" />
          <line class="grid-line" x1="0" y1="8" x2="8" y2="8" />
          <line class="grid-line" x1="0" y1="9" x2="8" y2="9" />
          <line class="grid-line" x1="0" y1="0" x2="0" y2="9" />
          <line class="grid-line" x1="8" y1="0" x2="8" y2="9" />
          <line class="grid-line" x1="1" y1="0" x2="1" y2="4" />
          <line class="grid-line" x1="1" y1="5" x2="1" y2="9" />
          <line class="grid-line" x1="2" y1="0" x2="2" y2="4" />
          <line class="grid-line" x1="2" y1="5" x2="2" y2="9" />
          <line class="grid-line" x1="3" y1="0" x2="3" y2="4" />
          <line class="grid-line" x1="3" y1="5" x2="3" y2="9" />
          <line class="grid-line" x1="4" y1="0" x2="4" y2="4" />
          <line class="grid-line" x1="4" y1="5" x2="4" y2="9" />
          <line class="grid-line" x1="5" y1="0" x2="5" y2="4" />
          <line class="grid-line" x1="5" y1="5" x2="5" y2="9" />
          <line class="grid-line" x1="6" y1="0" x2="6" y2="4" />
          <line class="grid-line" x1="6" y1="5" x2="6" y2="9" />
          <line class="grid-line" x1="7" y1="0" x2="7" y2="4" />
          <line class="grid-line" x1="7" y1="5" x2="7" y2="9" />
          <line class="grid-palace" x1="3" y1="0" x2="5" y2="2" />
          <line class="grid-palace" x1="5" y1="0" x2="3" y2="2" />
          <line class="grid-palace" x1="3" y1="7" x2="5" y2="9" />
          <line class="grid-palace" x1="5" y1="7" x2="3" y2="9" />
          <path class="grid-mark" d="M0.74 1.9L0.9 1.9L0.9 1.74M0.74 2.1L0.9 2.1L0.9 2.26M1.26 1.9L1.1 1.9L1.1 1.74M1.26 2.1L1.1 2.1L1.1 2.26" />
          <path class="grid-mark" d="M6.74 1.9L6.9 1.9L6.9 1.74M6.74 2.1L6.9 2.1L6.9 2.26M7.26 1.9L7.1 1.9L7.1 1.74M7.26 2.1L7.1 2.1L7.1 2.26" />
          <path class="grid-mark" d="M0.74 6.9L0.9 6.9L0.9 6.74M0.74 7.1L0.9 7.1L0.9 7.26M1.26 6.9L1.1 6.9L1.1 6.74M1.26 7.1L1.1 7.1L1.1 7.26" />
          <path class="grid-mark" d="M6.74 6.9L6.9 6.9L6.9 6.74M6.74 7.1L6.9 7.1L6.9 7.26M7.26 6.9L7.1 6.9L7.1 6.74M7.26 7.1L7.1 7.1L7.1 7.26" />
          <path class="grid-mark" d="M0.26 2.9L0.1 2.9L0.1 2.74M0.26 3.1L0.1 3.1L0.1 3.26" />
          <path class="grid-mark" d="M1.74 2.9L1.9 2.9L1.9 2.74M1.74 3.1L1.9 3.1L1.9 3.26M2.26 2.9L2.1 2.9L2.1 2.74M2.26 3.1L2.1 3.1L2.1 3.26" />
          <path class="grid-mark" d="M3.74 2.9L3.9 2.9L3.9 2.74M3.74 3.1L3.9 3.1L3.9 3.26M4.26 2.9L4.1 2.9L4.1 2.74M4.26 3.1L4.1 3.1L4.1 3.26" />
          <path class="grid-mark" d="M5.74 2.9L5.9 2.9L5.9 2.74M5.74 3.1L5.9 3.1L5.9 3.26M6.26 2.9L6.1 2.9L6.1 2.74M6.26 3.1L6.1 3.1L6.1 3.26" />
          <path class="grid-mark" d="M7.74 2.9L7.9 2.9L7.9 2.74M7.74 3.1L7.9 3.1L7.9 3.26" />
          <path class="grid-mark" d="M0.26 5.9L0.1 5.9L0.1 5.74M0.26 6.1L0.1 6.1L0.1 6.26" />
          <path class="grid-mark" d="M1.74 5.9L1.9 5.9L1.9 5.74M1.74 6.1L1.9 6.1L1.9 6.26M2.26 5.9L2.1 5.9L2.1 5.74M2.26 6.1L2.1 6.1L2.1 6.26" />
          <path class="grid-mark" d="M3.74 5.9L3.9 5.9L3.9 5.74M3.74 6.1L3.9 6.1L3.9 6.26M4.26 5.9L4.1 5.9L4.1 5.74M4.26 6.1L4.1 6.1L4.1 6.26" />
          <path class="grid-mark" d="M5.74 5.9L5.9 5.9L5.9 5.74M5.74 6.1L5.9 6.1L5.9 6.26M6.26 5.9L6.1 5.9L6.1 5.74M6.26 6.1L6.1 6.1L6.1 6.26" />
          <path class="grid-mark" d="M7.74 5.9L7.9 5.9L7.9 5.74M7.74 6.1L7.9 6.1L7.9 6.26" />
        </g>
        <g class="grid-river" aria-hidden="true">
          <text class="grid-river-text" x="1.9" y="4.73">楚 河</text>
          <text class="grid-river-text" x="6.1" y="4.73">汉 界</text>
        </g>
      </svg>
      <div class="board-layer board-layer--marks" id="layer-marks" aria-hidden="true"></div>
      <div class="board-layer board-layer--pieces" id="layer-pieces"></div>
    </div>
    <p class="board-hint" id="board-hint">点自己的棋子 → 点亮点落子</p>
  </main>

  <p class="boot-note" id="boot-note">正在加载棋局…如果一直停在这里，请刷新页面（需要启用 JavaScript）。</p>

</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" hidden>
  <div class="overlay-card">
    <p class="overlay-kicker" id="overlay-kicker">对局结束</p>
    <h2 class="overlay-title" id="overlay-title">对局结束</h2>
    <p class="overlay-reason" id="overlay-reason"></p>
    <div class="overlay-actions">
      <button class="btn btn--primary" id="btn-again" type="button">再来一局</button>
      <button class="btn" id="btn-overlay-record" type="button">导出记谱</button>
      <button class="btn btn--ghost" id="btn-overlay-close" type="button">看棋盘</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <div class="noscript">
    <h1>需要 JavaScript</h1>
    <p>这个对弈页面依赖 JavaScript 才能从本机服务拉取棋局、接收实时推送并走子。</p>
    <p>请在浏览器设置里启用 JavaScript 后刷新本页；如果是从 DSH 拿到的邀请链接，请确认链接完整（包含口令参数）。</p>
  </div>
</noscript>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
