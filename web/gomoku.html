<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="五子棋对弈：人类在浏览器落子，agent 用工具应战。">
<title>五子棋 · 与 agent 对弈</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/gomoku.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="turn"><span class="dot" id="turn-dot"></span><span id="turn-text">正在连接…</span><span class="you" id="turn-you" hidden>你</span></div>
    <div class="timer" id="timer">--:--</div>
  </header>

  <main class="stage">
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="五子棋棋盘 15×15">
      <svg class="board-grid" id="board-grid" viewBox="0 0 14 14" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <line x1="0" y1="0" x2="0" y2="14" />
        <line x1="0" y1="0" x2="14" y2="0" />
        <line x1="1" y1="0" x2="1" y2="14" />
        <line x1="0" y1="1" x2="14" y2="1" />
        <line x1="2" y1="0" x2="2" y2="14" />
        <line x1="0" y1="2" x2="14" y2="2" />
        <line x1="3" y1="0" x2="3" y2="14" />
        <line x1="0" y1="3" x2="14" y2="3" />
        <line x1="4" y1="0" x2="4" y2="14" />
        <line x1="0" y1="4" x2="14" y2="4" />
        <line x1="5" y1="0" x2="5" y2="14" />
        <line x1="0" y1="5" x2="14" y2="5" />
        <line x1="6" y1="0" x2="6" y2="14" />
        <line x1="0" y1="6" x2="14" y2="6" />
        <line x1="7" y1="0" x2="7" y2="14" />
        <line x1="0" y1="7" x2="14" y2="7" />
        <line x1="8" y1="0" x2="8" y2="14" />
        <line x1="0" y1="8" x2="14" y2="8" />
        <line x1="9" y1="0" x2="9" y2="14" />
        <line x1="0" y1="9" x2="14" y2="9" />
        <line x1="10" y1="0" x2="10" y2="14" />
        <line x1="0" y1="10" x2="14" y2="10" />
        <line x1="11" y1="0" x2="11" y2="14" />
        <line x1="0" y1="11" x2="14" y2="11" />
        <line x1="12" y1="0" x2="12" y2="14" />
        <line x1="0" y1="12" x2="14" y2="12" />
        <line x1="13" y1="0" x2="13" y2="14" />
        <line x1="0" y1="13" x2="14" y2="13" />
        <line x1="14" y1="0" x2="14" y2="14" />
        <line x1="0" y1="14" x2="14" y2="14" />
        <circle cx="3" cy="11" r="0.12" />
        <circle cx="11" cy="11" r="0.12" />
        <circle cx="3" cy="3" r="0.12" />
        <circle cx="11" cy="3" r="0.12" />
        <circle cx="7" cy="7" r="0.12" />
      </svg>
        <div class="board-stones" id="board-stones"></div>
        <div class="board-ghost" id="board-ghost" hidden></div>
      </div>
    </div>
    <p class="hint" id="hint">点空点落子</p>
  </main>

  <div class="toolbar">
    <button class="btn btn--primary" id="btn-new" type="button">新局</button>
    <button class="btn" id="btn-resign" type="button">认输</button>
    <button class="btn" id="btn-record" type="button">记谱</button>
    <button class="btn btn--icon" id="btn-sound" type="button" aria-pressed="true">🔊</button>
  </div>

  <section class="record">
    <div class="record-head"><span>棋谱</span><span id="record-count">0 手</span></div>
    <ol class="record-list" id="record-list"></ol>
    <p class="record-empty" id="record-empty">还没有落子。黑先。</p>
  </section>

  <p class="boot-note" id="boot-note">正在加载棋局…如果一直停在这里，请刷新页面（需要启用 JavaScript）。</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <h2 id="overlay-title">对局结束</h2>
    <p id="overlay-reason"></p>
    <div class="overlay-actions">
      <button class="btn btn--primary" id="btn-again" type="button">再来一局</button>
      <button class="btn" id="btn-overlay-record" type="button">导出记谱</button>
      <button class="btn btn--ghost" id="btn-overlay-close" type="button">看棋盘</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<noscript>
  <div class="noscript"><h1>需要 JavaScript</h1><p>这个页面依赖 JavaScript 才能拉取棋局与落子，请启用后刷新。</p></div>
</noscript>

<script type="module" src="/assets/gomoku.js"></script>
</body>
</html>
